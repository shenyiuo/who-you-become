<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成为 / WHO YOU BECOME</title>
<style>
  :root{
    --ink:#111;
    --paper:#eae6dd;
    --line:#111;
    --dim:#6f6b62;
    --hot:#b8472d;
    --gold:#9a7b3f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--paper);color:var(--ink);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    line-height:1.7;padding:48px 20px 90px;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:600px;margin:0 auto;}

  .head{margin-bottom:34px;}
  .kicker{font-size:11px;letter-spacing:4px;font-weight:700;color:var(--dim);text-transform:uppercase;}
  .title{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.05;margin-top:10px;}
  .title em{font-style:italic;}
  .lead{font-size:14px;color:var(--dim);margin-top:16px;line-height:1.7;}

  .rule{height:3px;background:var(--line);margin:24px 0;}

  /* progress */
  .steps{display:flex;gap:6px;margin-bottom:28px;}
  .dot{flex:1;height:5px;background:#d3cec3;}
  .dot.done{background:var(--line);}
  .dot.now{background:var(--hot);}

  /* question card */
  .qstage{}
  .qnum{font-size:11px;letter-spacing:3px;font-weight:800;color:var(--hot);text-transform:uppercase;}
  .qtext{font-size:21px;font-weight:700;line-height:1.5;margin:10px 0 6px;}
  .qhint{font-size:13px;color:var(--dim);margin-bottom:14px;}

  textarea{
    width:100%;border:3px solid var(--line);background:#fff;
    padding:14px;font-size:16px;font-family:inherit;line-height:1.7;
    resize:vertical;min-height:120px;
  }
  textarea:focus{outline:none;background:#fffdf6;}
  ::placeholder{color:#b7b2a6;}

  .btn{
    width:100%;background:var(--line);color:var(--paper);border:none;
    padding:17px;font-size:15px;font-weight:800;letter-spacing:2px;
    cursor:pointer;margin-top:16px;font-family:inherit;transition:transform .08s,background .15s;
  }
  .btn:hover{background:var(--hot);}
  .btn:active{transform:scale(.99);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn.alt{background:#fff;color:var(--ink);border:3px solid var(--line);}
  .btn.alt:hover{background:var(--ink);color:var(--paper);}

  /* AI dig-deeper note */
  .dig{
    border-left:5px solid var(--hot);background:#fff;
    padding:12px 16px;margin-top:18px;font-size:14px;line-height:1.7;
  }
  .dig .dl{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--hot);
    text-transform:uppercase;margin-bottom:4px;}

  /* history echo */
  .echo{margin-bottom:22px;}
  .echo-item{border-left:3px solid #cdc8bc;padding:4px 0 4px 14px;margin-bottom:10px;}
  .echo-q{font-size:11px;color:var(--dim);font-weight:700;}
  .echo-a{font-size:13px;color:#444;margin-top:2px;}

  /* final */
  .final{
    border:4px solid var(--line);background:#fff;margin-top:10px;
  }
  .final .fh{
    background:var(--line);color:var(--paper);padding:10px 16px;
    font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;
  }
  .final .fbody{padding:26px 22px;}
  .final .flabel{font-size:12px;color:var(--dim);font-weight:700;margin-bottom:10px;}
  .sentence{
    font-size:27px;font-weight:800;line-height:1.4;letter-spacing:-.5px;
  }
  .sentence .svo{border-bottom:4px solid var(--hot);padding-bottom:1px;}
  .parts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}
  .part{border:2px solid var(--line);padding:5px 10px;font-size:12px;font-weight:700;}
  .part b{color:var(--hot);}

  .loading{font-size:13px;font-weight:700;letter-spacing:1px;color:var(--dim);margin-top:18px;}
  .err{border:3px solid var(--hot);color:var(--hot);padding:12px;font-size:13px;font-weight:700;margin-top:16px;}
  .hidden{display:none;}

  footer{margin-top:54px;border-top:2px solid var(--line);padding-top:14px;
    font-size:11px;color:var(--dim);letter-spacing:.5px;line-height:1.9;}

  @media(max-width:480px){
    .title{font-size:32px;}
    .sentence{font-size:22px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="kicker">Identity · 身份澄清</div>
    <div class="title">你究竟想<em>成为</em>谁</div>
    <div class="lead">不是一句漂亮的口号。我会一步步追问你 —— 从模糊到清晰 —— 最后帮你逼出一句话。一句主谓宾的话:谁、做什么、为了谁。具体到你自己都躲不开。</div>
  </div>

  <div class="rule"></div>

  <div class="steps" id="steps">
    <div class="dot now"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div>
  </div>

  <div id="echo" class="echo"></div>

  <div id="stage" class="qstage"></div>

  <div id="err" class="err hidden"></div>

  <footer>
    成为 · 这句话由你自己一步步逼出来,不是被生成的 —— 所以你会信它<br>
    它是「持续行动系统」的第一块地基。先想清成为谁,再谈每天做什么。
  </footer>

</div>

<script>
(function(){
  var ENDPOINT = '/api/clarify';
  var $ = function(id){ return document.getElementById(id); };

  // 五步递进:从真实情绪 -> 具体 -> 抽象 -> 收口成主谓宾
  var STEPS = [
    {
      num:'第一步 / 从羡慕开始',
      q:'最近一次,你打心底里羡慕某个人 —— 是什么时候?那个人当时在做什么?',
      hint:'不用宏大。可以是讲台上的某个人,也可以是身边一个具体的人。把那个画面写下来。'
    },
    {
      num:'第二步 / 羡慕的到底是什么',
      q:'你羡慕的,是他做的那件「事」,还是他身上的某种「状态」?具体说说。',
      hint:'比如 —— 是羡慕他在演讲,还是羡慕他「被许多人认真听着」的那种状态?'
    },
    {
      num:'第三步 / 三年后的那句话',
      q:'三年后,如果有人这样描述你,你会觉得「这几年值了」—— 那句描述会是什么?',
      hint:'用别人的口吻写。"他/她是一个……" 写得越具体越好。'
    },
    {
      num:'第四步 / 你为谁做',
      q:'你想成为的那个人,他做的事,是为了「谁」?谁会因为他而变得不一样?',
      hint:'一个身份只有连着「为谁」才有重量。是学生?是某一类人?还是某个具体的群体?'
    },
    {
      num:'第五步 / 收口',
      q:'好。现在,把前面所有的,收成一句话试试 —— 「我（做什么）（为了谁）」。',
      hint:'先别求完美,写一个粗糙的版本就行。下一步我帮你把它锻造成最终形态。'
    }
  ];

  var state = { answers:[], idx:0, digNote:'' };

  function showErr(m){ var e=$('err'); e.textContent='出错了:'+m; e.classList.remove('hidden'); }
  function clearErr(){ $('err').classList.add('hidden'); }

  function callAI(messages, cb){
    clearErr();
    fetch(ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:messages})
    })
    .then(function(r){
      return r.json().then(function(d){
        if(!r.ok) throw new Error(d && d.error ? d.error : ('HTTP '+r.status));
        return d;
      });
    })
    .then(function(d){ cb(d.text||''); })
    .catch(function(e){ showErr(e.message); });
  }

  function esc(s){
    var d=document.createElement('div');
    d.textContent=(s==null)?'':String(s);
    return d.innerHTML;
  }

  function renderSteps(){
    var dots = $('steps').children;
    for(var i=0;i<dots.length;i++){
      dots[i].className = 'dot' + (i<state.idx?' done':(i===state.idx?' now':''));
    }
  }

  function renderEcho(){
    var box = $('echo');
    if(state.answers.length===0){ box.innerHTML=''; return; }
    var h = '';
    for(var i=0;i<state.answers.length;i++){
      h += '<div class="echo-item"><div class="echo-q">'+esc(STEPS[i].num)+'</div>'
         + '<div class="echo-a">'+esc(state.answers[i])+'</div></div>';
    }
    box.innerHTML = h;
  }

  // 普通追问步骤
  function renderQuestion(){
    renderSteps();
    renderEcho();
    var s = STEPS[state.idx];
    var h = '';
    h += '<div class="qnum">'+esc(s.num)+'</div>';
    h += '<div class="qtext">'+esc(s.q)+'</div>';
    h += '<div class="qhint">'+esc(s.hint)+'</div>';
    if(state.digNote){
      h += '<div class="dig"><div class="dl">再想深一点</div>'+esc(state.digNote)+'</div>';
    }
    h += '<textarea id="ans" placeholder="写下来,想到什么写什么……"></textarea>';
    var lastStep = (state.idx === STEPS.length-1);
    h += '<button class="btn" id="next">'+(lastStep?'锻造最终的那句话 →':'继续 →')+'</button>';
    $('stage').innerHTML = h;
    $('next').addEventListener('click', onNext);
    $('ans').focus();
  }

  function onNext(){
    var val = $('ans').value.trim();
    if(!val){ showErr('写一点再继续 —— 哪怕不完整。'); return; }
    clearErr();

    var lastStep = (state.idx === STEPS.length-1);

    if(lastStep){
      state.answers[state.idx] = val;
      forgeFinal();
      return;
    }

    // 让 AI 判断这个回答够不够具体:够 -> 进下一步;不够 -> 给一句追问,留在原步
    $('stage').insertAdjacentHTML('beforeend','<div class="loading">在想怎么追问你……</div>');

    var sys = '你是一个帮人「想清楚自己要成为谁」的引导者。用户正在逐步回答。'
      + '你的任务:判断用户当前这个回答是否足够具体、足够真实。'
      + '如果回答空泛(比如只有"优秀""自律""厉害"这种形容词,没有具体的人、事、画面),'
      + '就温和但锋利地指出来,给一句追问,逼他更具体。'
      + '如果回答已经足够具体,就放行。'
      + '只输出一个严格 JSON,不要 markdown:'
      + '{"ok": true 或 false, "dig": "如果ok为false,这里写一句追问/提示,要具体、点到痛处;如果ok为true,留空字符串"}';

    var ctx = '当前问题:' + STEPS[state.idx].q + '\n用户的回答:' + val;
    if(state.digNote) ctx += '\n(这是用户在被追问后的二次回答)';

    callAI(
      [{role:'system',content:sys},{role:'user',content:ctx+'\n\n判断并输出JSON。'}],
      function(txt){
        var obj = parseJSON(txt);
        // 解析失败时,宽容放行,避免卡住用户
        if(!obj){ advance(val); return; }
        if(obj.ok || !obj.dig){
          advance(val);
        }else{
          // 留在原步,带上追问
          state.digNote = obj.dig;
          // 记下这次的回答作为上下文,但不计入正式answers
          renderQuestion();
          $('ans').value = val;
        }
      }
    );
  }

  function advance(val){
    state.answers[state.idx] = val;
    state.digNote = '';
    state.idx++;
    renderQuestion();
  }

  function parseJSON(txt){
    var s=txt.indexOf('{'), e=txt.lastIndexOf('}');
    if(s<0||e<0) return null;
    try{ return JSON.parse(txt.slice(s,e+1)); }catch(err){ return null; }
  }

  // 最终:把所有回答锻造成一句主谓宾
  function forgeFinal(){
    renderSteps();
    renderEcho();
    $('stage').innerHTML = '<div class="loading">正在把你说的一切,锻造成一句话……</div>';

    var sys = '你是一个帮人提炼「身份陈述」的锻造师。'
      + '用户回答了一系列关于「想成为谁」的问题。你要把这些,提炼成唯一一句话。'
      + '严格要求:'
      + '1. 这句话必须是「主语+谓语+宾语」结构,主语就是「我」。'
      + '2. 必须包含一个具体的「动作动词」(做什么),和一个具体的「对象/为了谁」。'
      + '3. 绝对禁止形容词堆砌。"我想成为优秀的人"是失败的。"我帮创业者把模糊的想法讲清楚"是成功的。'
      + '4. 必须忠于用户自己的回答,用他的原料,不要凭空添加他没提过的东西。'
      + '5. 这句话要让用户读到时心里"咯噔"一下 —— 真实、具体、躲不掉。'
      + '只输出一个严格 JSON,不要 markdown:'
      + '{"sentence":"完整的那句话","subject":"主语","verb":"谓语动作","object":"宾语/为了谁","why":"一句话:为什么这句话抓住了用户的核心,40字以内"}';

    var material = '';
    for(var i=0;i<state.answers.length;i++){
      material += STEPS[i].num + ':' + state.answers[i] + '\n';
    }

    callAI(
      [{role:'system',content:sys},{role:'user',content:material+'\n\n锻造这句话,输出JSON。'}],
      function(txt){
        var obj = parseJSON(txt);
        if(!obj || !obj.sentence){ showErr('锻造失败了,刷新页面重来一次。'); return; }
        renderFinal(obj);
      }
    );
  }

  function renderFinal(obj){
    for(var i=0;i<$('steps').children.length;i++){
      $('steps').children[i].className='dot done';
    }
    var h = '';
    h += '<div class="final">';
    h += '<div class="fh">你逼出来的那句话</div>';
    h += '<div class="fbody">';
    h += '<div class="flabel">这不是口号。这是接下来每一天,你做或不做一件事的标尺。</div>';
    h += '<div class="sentence"><span class="svo">'+esc(obj.sentence)+'</span></div>';
    h += '<div class="parts">';
    if(obj.subject) h+='<div class="part"><b>谁</b> '+esc(obj.subject)+'</div>';
    if(obj.verb)    h+='<div class="part"><b>做什么</b> '+esc(obj.verb)+'</div>';
    if(obj.object)  h+='<div class="part"><b>为了谁</b> '+esc(obj.object)+'</div>';
    h += '</div>';
    if(obj.why){
      h += '<div class="dig" style="margin-top:20px;"><div class="dl">为什么是这句</div>'+esc(obj.why)+'</div>';
    }
    h += '</div></div>';
    h += '<button class="btn alt" id="again">重新走一遍</button>';
    $('stage').innerHTML = h;
    $('again').addEventListener('click', function(){
      if(confirm('确定重新开始?当前这句话不会保存。')) location.reload();
    });
    $('echo').innerHTML='';
  }

  // start
  renderQuestion();

})();
</script>
</body>
</html>

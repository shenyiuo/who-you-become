<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对坐 / THE SAGE</title>
<style>
  :root{
    --ink:#1a1714;
    --paper:#ece7dc;
    --paper-2:#e3ddcf;
    --line:#1a1714;
    --dim:#756f63;
    --sage:#3f5347;
    --hot:#a8472e;
    --gold:#8a6d36;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--paper);color:var(--ink);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Songti SC","Helvetica Neue",serif;
    line-height:1.85;padding:46px 20px 90px;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:600px;margin:0 auto;}

  .head{text-align:center;margin-bottom:38px;}
  .kicker{font-size:11px;letter-spacing:5px;font-weight:700;color:var(--dim);}
  .title{font-size:34px;font-weight:800;letter-spacing:3px;margin-top:12px;}
  .lead{font-size:13px;color:var(--dim);margin-top:14px;line-height:1.8;}
  .hr{width:40px;height:3px;background:var(--line);margin:22px auto 0;}

  .stream{margin-top:10px;}

  .turn{margin-bottom:24px;animation:rise .5s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .sage .who{
    font-size:11px;letter-spacing:3px;font-weight:800;color:var(--sage);
    margin-bottom:6px;
  }
  .sage .say{
    font-size:17px;line-height:1.9;color:var(--ink);
    border-left:3px solid var(--sage);padding:2px 0 2px 16px;
  }
  .sage .insight{display:block;margin-top:10px;font-weight:700;}
  .sage .ask{display:block;margin-top:14px;font-size:15px;color:var(--dim);}

  .me{text-align:right;}
  .me .who{
    font-size:11px;letter-spacing:3px;font-weight:800;color:var(--dim);
    margin-bottom:6px;
  }
  .me .say{
    display:inline-block;text-align:left;max-width:90%;
    font-size:15px;line-height:1.8;background:var(--paper-2);
    padding:10px 14px;border:1px solid #cfc8b8;
  }

  .inputzone{margin-top:8px;}
  textarea{
    width:100%;border:3px solid var(--line);background:#fff;
    padding:14px;font-size:16px;font-family:inherit;line-height:1.8;
    resize:vertical;min-height:104px;
  }
  textarea:focus{outline:none;background:#fffdf6;}
  ::placeholder{color:#b8b2a3;}

  .row{display:flex;gap:10px;margin-top:12px;}
  .btn{
    flex:1;background:var(--line);color:var(--paper);border:none;
    padding:15px;font-size:14px;font-weight:800;letter-spacing:2px;
    cursor:pointer;font-family:inherit;transition:transform .08s,background .15s;
  }
  .btn:hover{background:var(--sage);}
  .btn:active{transform:scale(.99);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn.ghost{
    flex:0 0 auto;background:transparent;color:var(--dim);
    border:2px solid #c3bcac;letter-spacing:1px;
  }
  .btn.ghost:hover{background:transparent;color:var(--hot);border-color:var(--hot);}

  .verdict{
    margin-top:14px;border:4px solid var(--line);background:#fff;
    animation:rise .6s ease both;
  }
  .verdict .vh{
    background:var(--line);color:var(--paper);padding:11px 16px;
    font-size:11px;font-weight:800;letter-spacing:3px;text-align:center;
  }
  .verdict .vbody{padding:30px 24px;text-align:center;}
  .verdict .vpre{font-size:13px;color:var(--dim);margin-bottom:16px;}
  .vsentence{font-size:25px;font-weight:800;line-height:1.55;letter-spacing:.3px;}
  .vsentence .mark{background:linear-gradient(transparent 62%, #e7c98a 62%);padding:0 2px;}
  .vparts{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
  .vpart{border:2px solid var(--line);padding:5px 11px;font-size:12px;font-weight:700;}
  .vpart b{color:var(--hot);font-weight:800;}
  .vnote{
    margin-top:20px;font-size:14px;line-height:1.85;color:var(--sage);
    border-top:1px solid #d8d1c1;padding-top:16px;text-align:left;
  }

  .loading{
    font-size:14px;color:var(--sage);font-weight:700;letter-spacing:1px;padding:8px 0;
  }
  .loading::after{content:'';animation:dots 1.4s steps(4,end) infinite;}
  @keyframes dots{0%{content:'';}25%{content:'·';}50%{content:'··';}75%{content:'···';}}

  .err{border:3px solid var(--hot);color:var(--hot);padding:12px;
    font-size:13px;font-weight:700;margin-top:14px;}
  .hidden{display:none;}

  footer{margin-top:56px;border-top:2px solid var(--line);padding-top:14px;
    font-size:11px;color:var(--dim);letter-spacing:.5px;line-height:1.9;text-align:center;}

  @media(max-width:480px){
    .title{font-size:28px;}
    .vsentence{font-size:21px;}
    .sage .say{font-size:16px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="kicker">THE SAGE</div>
    <div class="title">对　坐</div>
    <div class="lead">不是问卷,是一场对话。<br>有一个人会安静地听你说,偶尔点破你没看清的东西。<br>聊到最后,他会送你一句话 —— 关于你究竟想成为谁。</div>
    <div class="hr"></div>
  </div>

  <div id="stream" class="stream"></div>

  <div id="err" class="err hidden"></div>

  <footer>
    对坐 · 你主导这场对话,他只是比你多看见一点<br>
    这是「持续行动系统」的地基 —— 先看清要成为谁,再谈每天做什么。
  </footer>

</div>

<script>
(function(){
  var ENDPOINT = '/api/clarify';
  var $ = function(id){ return document.getElementById(id); };

  var convo = [];
  var turnCount = 0;
  var MIN_TURNS = 3;
  var ended = false;

  var SAGE_SYSTEM = [
    '你是一位智者,正与一个人对坐交谈。这场对话只有一个目的:帮他想清楚,自己究竟想「成为」一个什么样的人。',
    '',
    '【你的气质】温和与犀利并存。你不会让对方紧张 —— 你的语气平静、接纳,像一位年长的引路人。',
    '但你又是犀利的 —— 你能看见对方话里没说出口的东西,能在某个瞬间一针见血,让他心头一震。',
    '',
    '【最重要的:你不是考官,是镜子】',
    '绝不审核、评判对方答得"够不够好",绝不因为他答得空泛就把他驳回、要求重答。他说什么,你就接住什么。',
    '你存在的意义不是「提问」,而是「洞察」。',
    '',
    '【你每一轮要做的】',
    '1. 先真正接住对方刚说的话 —— 用你自己的话复述、回应,让他确切地感到「被听见了」。',
    '2. 然后给出一个洞察 —— 说出一个他自己没意识到、但听完会「啊」一声的东西:点破他两句话之间的隐藏联系;指出他真正在意的其实不是他以为的那个;把他模糊的感觉替他说清楚。这是整场对话的灵魂,目标是让他「茅塞顿开」。',
    '3. 最后,一个问题自然地从你的洞察里延伸出来 —— 轻轻一带,不要审问感。这个问题必须长在你刚才的洞察上,而不是预设好的下一题。',
    '',
    '【节奏】对话是流动的,没有固定步数。顺着他的话往深处走:从具体的事 → 他真正在意的 → 他想成为的那种存在。',
    '',
    '【输出格式】每一轮严格只输出一个 JSON,不要 markdown、不要多余文字:',
    '{',
    '  "echo": "接住对方的话,1-2句,让他感到被听见",',
    '  "insight": "你的洞察 —— 那个让他可能顿悟的观察,1-2句,这是重点,要有分量",',
    '  "ask": "从洞察里自然延伸的一个问题,1句,口吻温和不审问",',
    '  "ready": true 或 false',
    '}',
    'echo 和 insight 要克制、有力,不要冗长。语言:中文。'
  ].join('\n');

  var FORGE_SYSTEM = [
    '你是那位智者。你和对方的对坐已接近尾声。现在,你要把这一整场对话,收束成你送给他的一句话。',
    '',
    '这句话的要求,极其严格:',
    '1. 必须是「主语+谓语+宾语」结构,主语是「我」。',
    '2. 必须含一个具体的「动作动词」和一个具体的「对象 / 为了谁」。',
    '3. 绝对禁止形容词堆砌。"我要成为优秀的人"是失败的;"我帮还不敢开口的人,把心里的话说出来"是成功的。',
    '4. 必须忠于这场对话里他自己说过的东西,用他的原料,不要凭空添加。',
    '5. 这句话由你 —— 智者 —— 说出来,作为你听完这一切后下的定音。它要让他读到的瞬间「啊……原来如此」,有茅塞顿开之感。',
    '',
    '严格只输出一个 JSON,不要 markdown:',
    '{',
    '  "lead_in": "智者郑重交出这句话之前的引入语,1-2句",',
    '  "sentence": "那句话本身,主谓宾",',
    '  "subject": "主语",',
    '  "verb": "谓语动作",',
    '  "object": "宾语 / 为了谁",',
    '  "note": "智者最后的赠言:为什么是这句话,它如何收住了你们这一路谈到的一切,2-3句,温和而有重量"',
    '}',
    '语言:中文。'
  ].join('\n');

  var OPENING = {
    echo: '',
    insight: '我们随意聊聊。不必给我「正确答案」—— 这里没有答案,只有你。',
    ask: '先说说:最近一次,你由衷地羡慕某个人,是什么时候?那个人当时在做什么?'
  };

  function showErr(m){ var e=$('err'); e.textContent='出错了:'+m; e.classList.remove('hidden'); }
  function clearErr(){ $('err').classList.add('hidden'); }

  function callAI(messages, cb){
    clearErr();
    fetch(ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:messages})
    })
    .then(function(r){
      return r.json().then(function(d){
        if(!r.ok) throw new Error(d&&d.error?d.error:('HTTP '+r.status));
        return d;
      });
    })
    .then(function(d){ cb(d.text||''); })
    .catch(function(e){ showErr(e.message); });
  }

  function parseJSON(txt){
    var s=txt.indexOf('{'), e=txt.lastIndexOf('}');
    if(s<0||e<0) return null;
    try{ return JSON.parse(txt.slice(s,e+1)); }catch(err){ return null; }
  }

  function esc(s){
    var d=document.createElement('div');
    d.textContent=(s==null)?'':String(s);
    return d.innerHTML;
  }

  function paintSage(obj){
    var div=document.createElement('div');
    div.className='turn sage';
    var h='<div class="who">智者</div><div class="say">';
    if(obj.echo) h+=esc(obj.echo)+' ';
    if(obj.insight) h+='<span class="insight">'+esc(obj.insight)+'</span>';
    if(obj.ask) h+='<span class="ask">'+esc(obj.ask)+'</span>';
    h+='</div>';
    div.innerHTML=h;
    $('stream').appendChild(div);
    div.scrollIntoView({behavior:'smooth',block:'end'});
  }

  function paintMe(text){
    var div=document.createElement('div');
    div.className='turn me';
    div.innerHTML='<div class="who">你</div><div class="say">'+esc(text)+'</div>';
    $('stream').appendChild(div);
    div.scrollIntoView({behavior:'smooth',block:'end'});
  }

  function paintInput(canForge){
    var old=$('inputzone'); if(old) old.remove();
    var div=document.createElement('div');
    div.className='turn'; div.id='inputzone';
    var h='<div class="inputzone"><textarea id="say" placeholder="慢慢说,想到什么说什么……"></textarea>';
    h+='<div class="row"><button class="btn" id="send">说下去</button>';
    if(canForge){
      h+='<button class="btn ghost" id="forge">想清楚了,收尾</button>';
    }
    h+='</div></div>';
    div.innerHTML=h;
    $('stream').appendChild(div);
    $('send').addEventListener('click', onSend);
    var fg=$('forge'); if(fg) fg.addEventListener('click', function(){ doForge(); });
    $('say').focus();
    div.scrollIntoView({behavior:'smooth',block:'end'});
  }

  function paintLoading(){
    var old=$('inputzone'); if(old) old.remove();
    var div=document.createElement('div');
    div.className='turn'; div.id='loadzone';
    div.innerHTML='<div class="loading">他在听,在想</div>';
    $('stream').appendChild(div);
    div.scrollIntoView({behavior:'smooth',block:'end'});
  }
  function clearLoading(){ var l=$('loadzone'); if(l) l.remove(); }

  function onSend(){
    var t=$('say').value.trim();
    if(!t){ showErr('说一点吧 —— 哪怕只是一个模糊的念头。'); return; }
    clearErr();
    paintMe(t);
    convo.push({role:'user', content:t});
    turnCount++;
    paintLoading();

    var messages=[{role:'system',content:SAGE_SYSTEM}].concat(convo);
    callAI(messages, function(txt){
      clearLoading();
      var obj=parseJSON(txt);
      if(!obj){ showErr('他一时语塞 —— 再说一次试试。'); paintInput(turnCount>=MIN_TURNS); return; }
      convo.push({role:'assistant', content:JSON.stringify(obj)});
      paintSage(obj);
      var canForge = (turnCount>=MIN_TURNS) || obj.ready===true;
      paintInput(canForge);
    });
  }

  function doForge(){
    if(ended) return;
    ended=true;
    var old=$('inputzone'); if(old) old.remove();
    paintLoading();

    var messages=[{role:'system',content:FORGE_SYSTEM}]
      .concat(convo)
      .concat([{role:'user',content:'我们的对话到这里。现在,请你把这一整场对坐,收成你要送我的那句话。严格按 JSON 输出。'}]);

    callAI(messages, function(txt){
      clearLoading();
      var obj=parseJSON(txt);
      if(!obj||!obj.sentence){
        showErr('收尾时他停顿了 —— 刷新页面,你们可以重新对坐一次。');
        ended=false; return;
      }
      paintVerdict(obj);
    });
  }

  function paintVerdict(obj){
    var div=document.createElement('div');
    div.className='turn';
    var h='';
    if(obj.lead_in){
      h+='<div class="sage" style="margin-bottom:14px;"><div class="who">智者</div>'
        +'<div class="say">'+esc(obj.lead_in)+'</div></div>';
    }
    h+='<div class="verdict"><div class="vh">他 送 你 的 那 句 话</div><div class="vbody">';
    h+='<div class="vpre">这不是口号。这是往后每一天,你做或不做一件事的标尺。</div>';
    h+='<div class="vsentence"><span class="mark">'+esc(obj.sentence)+'</span></div>';
    h+='<div class="vparts">';
    if(obj.subject) h+='<div class="vpart"><b>谁</b> '+esc(obj.subject)+'</div>';
    if(obj.verb)    h+='<div class="vpart"><b>做什么</b> '+esc(obj.verb)+'</div>';
    if(obj.object)  h+='<div class="vpart"><b>为了谁</b> '+esc(obj.object)+'</div>';
    h+='</div>';
    if(obj.note) h+='<div class="vnote">'+esc(obj.note)+'</div>';
    h+='</div></div>';
    h+='<div class="row" style="margin-top:16px;">'
      +'<button class="btn ghost" id="restart" style="flex:1;">重新对坐一次</button></div>';
    div.innerHTML=h;
    $('stream').appendChild(div);
    $('restart').addEventListener('click',function(){
      if(confirm('重新开始?这次的对话和那句话不会保存。')) location.reload();
    });
    div.scrollIntoView({behavior:'smooth',block:'end'});
  }

  paintSage(OPENING);
  paintInput(false);

})();
</script>
</body>
</html>
